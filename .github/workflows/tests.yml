name: tests

on:
  push:
    branches: ["main", "implementation/**", "test/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Verify clean MCP package installation
        run: python -m pip install ./flatforge_mcp
      - name: Compile project
        run: python -m compileall -q flatforge_proto flatforge_worker flatforge_mcp flatforge_maker scripts
      - name: Run tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q
      - name: Smoke-test live TCP worker
        env:
          PYTHONPATH: .
        run: python scripts/smoke_test_worker.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose configuration
        run: docker compose config --quiet
      - name: Build worker image
        run: docker build --pull -f Dockerfile.worker -t flatforge-worker:ci .
      - name: Build MCP image
        run: docker build --pull -f Dockerfile.mcp -t flatforge-mcp:ci .
