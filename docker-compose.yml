services:
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      FLATFORGE_HOST: 0.0.0.0
      FLATFORGE_PORT: 8765
      FLATFORGE_TOKEN: ${FLATFORGE_TOKEN:-}
    ports:
      - "127.0.0.1:8765:8765"
  mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    environment:
      FLATFORGE_HOST: worker
      FLATFORGE_PORT: 8765
      FLATFORGE_TOKEN: ${FLATFORGE_TOKEN:-}
    depends_on:
      - worker
